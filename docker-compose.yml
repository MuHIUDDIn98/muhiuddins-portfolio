# /srv/portfolio/docker-compose.yml
# ---
services:
  # --- Your Django App (Gunicorn) ---
  app:
    build: .
    container_name: "portfolio-tenant"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - PORTFOLIO_DOMAINS=${PORTFOLIO_DOMAINS}
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - media_volume:/app/mediafiles
      - static_volume:/app/staticfiles  # <-- ADD THIS VOLUME
    networks:
      - webnet
      - internal
    depends_on:
      - db
    # --- LABELS REMOVED ---
    # Traefik will no longer talk to this service directly.
    # Its labels are now on the 'nginx' service below.

  # --- NEW: Nginx Web Server ---
  nginx:
    image: nginx:1.25-alpine
    container_name: "portfolio-web"
    restart: unless-stopped
    volumes:
      # Mount the volumes for media and static files (read-only)
      - media_volume:/app/mediafiles:ro
      - static_volume:/app/staticfiles:ro
      # Mount your new config file
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - webnet     # Public network for Traefik
      - internal   # Private network to talk to 'app'
    depends_on:
      - app        # Wait for Gunicorn to start
    labels:
      # --- TRAEFIK LABELS MOVED HERE ---
      - "traefik.enable=true"
      - "traefik.http.routers.portfolio.rule=Host(`${PORTFOLIO_DOMAIN}`) || Host(`www.${PORTFOLIO_DOMAIN}`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls.certresolver=myresolver"
      # Nginx listens on port 80 inside the container
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"

  # --- PostgreSQL Database ---
  db:
    image: postgres:15-alpine
    container_name: "portfolio-db"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal

networks:
  webnet:
    external: true
    name: webnet
  internal:
    external: false

volumes:
  db_data:
  media_volume:
  static_volume:  # <-- This was added